<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sustainability</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="hero.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="footer.css" />
  <link rel="stylesheet" href="about.css" />
  <link rel="stylesheet" href="sustainability.css" />
  <link rel="stylesheet" href="product-page.css" />


  <!-- Google Material Symbols (line icons) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet"
  />
</head>

  
<body>
  
  <!-- HEADER -->
<div id="header-placeholder"></div>


<section class="product-page container">
  <div class="product-grid">

   <!-- Product Media -->
<div class="product-media">
  <!-- Main Image -->
  <div class="image-main">
    <img src="https://via.placeholder.com/500x500.png?text=Main+Product" alt="Main Product">
  </div>

  <!-- Thumbnails -->
  <div class="image-thumbs">
    <span><img src="https://via.placeholder.com/100x100.png?text=Thumb+1" alt="Thumbnail 1"></span>
    <span><img src="https://via.placeholder.com/100x100.png?text=Thumb+2" alt="Thumbnail 2"></span>
    <span><img src="https://via.placeholder.com/100x100.png?text=Thumb+3" alt="Thumbnail 3"></span>
  </div>
</div>

    <!-- Product Info -->
    <div class="product-info">
      <h1 class="product-title">Minimal Desk Lamp</h1>
      <p class="product-subtitle">Warm light. Modern design. Built to last.</p>

      <div class="product-price">$129</div>

      <p class="product-description">
        A modern desk lamp crafted with premium materials.
        Designed for focus, comfort, and timeless aesthetics.
      </p>

      <div class="product-actions">
        <button class="btn primary">Add to Cart</button>
        <button class="btn secondary">Save</button>
      </div>

      <ul class="product-details">
        <li>✔ Adjustable brightness</li>
        <li>✔ Aluminum body</li>
        <li>✔ 2-year warranty</li>
      </ul>
    </div>

  </div>
</section>

  
<div id="sticky-buy" class="sticky-buy">
  <span>Bubunany Puppet</span>
  <a class="btn" href="#checkout">Buy Now</a>
</div>


   <!-- FOOTER -->
  <div id="footer-placeholder"></div>
  

  <!-- SCRIPT FOR FAQ TOGGLE -->
  <script>
    document.querySelectorAll('.faq-question').forEach(q => {
      q.addEventListener('click', () => {
        const answer = q.nextElementSibling;
        answer.style.display = answer.style.display === 'block' ? 'none' : 'block';
      });
    });
    
document.addEventListener("DOMContentLoaded", () => {
  const stickyBuy = document.getElementById("sticky-buy");
  const trigger = document.getElementById("characters");
  const footer = document.querySelector("footer");

  if (!stickyBuy || !trigger) return;

  window.addEventListener("scroll", () => {
    const triggerTop = trigger.getBoundingClientRect().top;

    if (triggerTop < 100) {
      stickyBuy.classList.add("active");
    } else {
      stickyBuy.classList.remove("active");
      stickyBuy.style.bottom = "0";
      return;
    }

    if (footer) {
      const footerTop = footer.getBoundingClientRect().top;
      const overlap = window.innerHeight - footerTop;

      stickyBuy.style.bottom = overlap > 0 ? `${overlap}px` : "0";
    }
  });
});

  </script>
  

  <!-- Scripts -->
<script src="header.js"></script>

<script>
  // Load header
  fetch("header.html")
    .then(res => res.text())
    .then(html => {
      const headerEl = document.getElementById("header-placeholder");
      if (!headerEl) return;

      headerEl.innerHTML = html;

      // Init only if functions exist
      if (typeof initHeader === "function") initHeader();
      if (typeof initProductsPage === "function") initProductsPage();
    })
    .catch(err => console.error("Header load failed:", err));
  
// Load hero
fetch("hero.html")
  .then(res => res.text())
  .then(html => {
    const heroEl = document.getElementById("hero-placeholder");
    if (!heroEl) return;

    heroEl.innerHTML = html;

    // Init only if functions exist
    if (typeof initHero === "function") initHero();
  })
  .catch(err => console.error("Hero load failed:", err));

  // Load footer
  fetch("footer.html")
    .then(res => res.text())
    .then(html => {
      const footerEl = document.getElementById("footer-placeholder");
      if (!footerEl) return;

      footerEl.innerHTML = html;

      // Init only if function exists
      if (typeof initFooter === "function") initFooter();
    })
    .catch(err => console.error("Footer load failed:", err));
</script>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const phrases = [
      "It’s playtime!",
      "Let the play begin!",
      "Time to play together",
      "Play starts here"
    ];

    const titleEl = document.getElementById("playtime-title");
    if (!titleEl) return;

    const randomIndex = Math.floor(Math.random() * phrases.length);
    titleEl.textContent = phrases[randomIndex];
  });
</script>


  <script src="footer.js"></script>
  <script src="hero.js"></script>


  </body>
</html>
