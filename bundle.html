<section class="bundle-section">
  <h2>Bundle & Save</h2>
  <p class="bundle-subtitle">Buy 1 + 1 = Get 1 Free</p>

  <div class="bundle-cards">

    <!-- Product 1 -->
    <div class="bundle-item">
      <div class="bundle-card">
        <img src="https://static.wixstatic.com/media/1799ca_6a749efdd7124e1a9de84aa8a4f30fea~mv2.png" alt="Product 1">
      </div>
      <strong>Product One</strong>
      <span>$25.00</span>
    </div>

    <div class="bundle-plus">+</div>

    <!-- Product 2 -->
    <div class="bundle-item">
      <div class="bundle-card">
        <img src="https://static.wixstatic.com/media/1799ca_6a749efdd7124e1a9de84aa8a4f30fea~mv2.png" alt="Product 2">
      </div>
      <strong>Product Two</strong>
      <span>$25.00</span>
    </div>

    <div class="bundle-equals">=</div>

    <!-- Product 3 -->
    <div class="bundle-item highlight">
      <div class="bundle-card">
        <img src="https://static.wixstatic.com/media/1799ca_6a749efdd7124e1a9de84aa8a4f30fea~mv2.png" alt="Product 3">
      </div>
      <strong>Product Three</strong>
      <span class="free">FREE</span>
    </div>

  </div>

  <button class="bundle-btn">Add Bundle to Cart</button>
