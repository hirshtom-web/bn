<section class="bundle-section">
  <h2>Bundle & Save</h2>
  <p class="bundle-subtitle">Get more for less — Buy 1 + 1 = 3!</p>

  <div class="bundle-cards">

    <!-- Product 1 -->
    <div class="bundle-card">
      <img src="https://via.placeholder.com/150" alt="Product 1">
      <strong>Product 1</strong>
      <span>$25.00</span>
    </div>

    <!-- Plus Icon -->
    <div class="bundle-plus">+</div>

    <!-- Product 2 -->
    <div class="bundle-card">
      <img src="https://via.placeholder.com/150" alt="Product 2">
      <strong>Product 2</strong>
      <span>$25.00</span>
    </div>

    <!-- Equals Icon -->
    <div class="bundle-equals">=</div>

    <!-- Product 3 -->
    <div class="bundle-card highlight">
      <img src="https://via.placeholder.com/150" alt="Product 3">
      <strong>Product 3</strong>
      <span>$0.00*</span>
    </div>

  </div>

  <button class="bundle-btn">Add Bundle to Cart</button>
</section>
