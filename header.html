<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Header Layout</title>

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <link rel="stylesheet" href="header.css" />
</head>
<body>

<!-- ================= TOP BAR ================= -->
<div class="top-bar">
  <div class="top-bar-inner">
    <div class="slider">
      <span>Free shipping over $50</span>
      <span>Safe for ages 3+</span>
      <span>Designed with love</span>
    </div>
  </div>
</div>

<!-- ================= HEADER ================= -->
<div class="main-header">
  <div class="header-inner">

    <div class="header-left">
      <span class="material-symbols-outlined">location_on</span>
      <span>Stores</span>

      <span class="material-symbols-outlined">star</span>
      <span>Reviews</span>
    </div>

    <div class="header-center">
      <div class="slider">
        <span>New arrivals just landed</span>
        <span>Limited edition drops</span>
        <span>Made with love</span>
      </div>
    </div>

    <div class="header-right">
      <span class="material-symbols-outlined">person</span>
      <span>Sign In</span>

      <span class="material-symbols-outlined">favorite</span>
      <span>Wishlist</span>
    </div>

  </div>
</div>

<!-- ================= AWNING ================= -->
<div class="awning-bar">
  <span>Spring Collection • Bright • Playful • Fun</span>
</div>

</body>
</html>
